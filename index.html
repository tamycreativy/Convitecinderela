<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Letícia Maria 15 anos • Convite</title>
<meta property="og:title" content="Letícia Maria 15 anos • Convite">
<meta property="og:image" content="assets/capa.webp">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b1020;color:#fff;font-family:'Patrick Hand',system-ui,sans-serif;overflow:hidden}
.scr{position:fixed;inset:0;display:none;overflow:hidden}
.scr.on{display:block}
.bg{position:absolute;inset:-10%;background-size:cover;background-position:center;filter:blur(24px) brightness(.55)}
.stage{position:absolute;top:0;left:50%;transform:translateX(-50%);height:100%;aspect-ratio:9/16;max-width:100%}
.stage>img,.stage>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#infoImg{opacity:0;transition:opacity .25s}#infoImg.on{opacity:1}
#capaImg{cursor:pointer;z-index:3;transition:opacity .15s}#capaImg.off{opacity:0;pointer-events:none}
.dica{z-index:4}.off+.dica{opacity:0;animation:none}
#capa{cursor:pointer}
.dica{position:absolute;left:0;right:0;bottom:6%;text-align:center;font-family:'Great Vibes',cursive;font-size:clamp(26px,8vw,44px);color:#fff;text-shadow:0 0 14px #7fb6ff,0 0 6px #fff,0 2px 8px #0008;animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6;transform:scale(.97)}}
#pular{display:none;position:absolute;right:14px;top:max(14px,env(safe-area-inset-top));z-index:5;background:#0006;color:#fff;border:1px solid #fff8;border-radius:20px;padding:6px 14px;font:inherit;font-size:16px;backdrop-filter:blur(4px)}
.hs{position:absolute;width:18.5%;aspect-ratio:1;border:0;border-radius:50%;background:transparent;cursor:pointer;z-index:4;opacity:0;pointer-events:none;padding:0}
.hs.on{pointer-events:auto}
.hs:active{background:#ffffff40}
#hC{left:20.7%;top:70.4%}#hL{left:40.7%;top:70.4%}#hP{left:61%;top:70.4%}
.back{position:absolute;left:12px;top:max(12px,env(safe-area-inset-top));z-index:6;background:#fffc;color:#2b4a7a;border:1px solid #c9a35a;border-radius:20px;padding:7px 16px;font:inherit;font-size:18px}
/* painel */
.ov{position:fixed;inset:0;background:#000a;z-index:20;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{width:min(100%,480px);background:linear-gradient(#f3f8ff,#d9e8fb);color:#27406b;border:2px solid #c9a35a;border-radius:20px 20px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));animation:up .3s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{margin:0 0 2px;font-family:'Great Vibes',cursive;font-weight:400;font-size:38px;text-align:center;color:#34568f}
.sheet p.s{margin:0 0 12px;text-align:center;font-size:18px}
.sheet label{display:block;margin:10px 0 4px;font-size:19px}
.sheet input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #c9a35a;background:#fff;color:#27406b;font:inherit;font-size:19px}
.btn{display:block;width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:linear-gradient(#7ea8e6,#4f7dc4);color:#fff;font:inherit;font-size:21px;font-weight:700;cursor:pointer}
.btn.g{background:transparent;color:#34568f;border:1px solid #c9a35a;margin-top:8px;font-size:18px;font-weight:400}
.aviso{margin-top:12px;font-size:16px;line-height:1.3;background:#ffffffb0;border-left:3px solid #c9a35a;padding:8px 10px;border-radius:6px}
.opt{display:flex;gap:8px}
.opt button{flex:1;padding:11px 6px;border-radius:10px;border:1px solid #c9a35a;background:#fff;color:#27406b;font:inherit;font-size:18px}
.opt button.sel{background:#4f7dc4;color:#fff;font-weight:700}
</style>
</head>
<body>

<section class="scr on" id="vid">
  <div class="bg" style="background-image:url(assets/capa.webp)"></div>
  <div class="stage">
    <video id="v" src="assets/abertura.mp4" poster="assets/capa.webp" playsinline preload="auto" muted></video>
    <img id="infoImg" src="assets/info.webp" alt="Convite Letícia Maria 15 anos">
    <img class="cv" id="capaImg" src="assets/capa.webp" alt="Convite Letícia Maria 15 anos">
    <div class="dica">Toque no envelope para abrir</div>
    <button class="hs" id="hC" aria-label="Confirmar presença"></button>
    <a class="hs" id="hL" aria-label="Local da festa" target="_blank" rel="noopener"></a>
    <button class="hs" id="hP" aria-label="Dicas de presentes"></button>
  </div>
  <button id="pular">Pular ▸</button>
</section>

<section class="scr" id="pres" style="z-index:15">
  <div class="bg" style="background-image:url(assets/presentes.webp)"></div>
  <div class="stage"><img src="assets/presentes.webp" alt="Dicas para presentear"></div>
  <button class="back" id="voltar">‹ Voltar</button>
</section>

<audio id="bgm" loop preload="auto" src="assets/musica.mp3"></audio>

<div class="ov" id="ovR"><div class="sheet">
  <h3>Confirmar presença</h3>
  <p class="s">Letícia Maria • 15 anos</p>
  <label for="nome">Seu nome</label>
  <input type="text" id="nome" placeholder="Nome completo">
  <label>Você vai?</label>
  <div class="opt"><button id="oSim" class="sel">Vou sim! 👑</button><button id="oNao">Não poderei ir</button></div>
  <div id="qb"><label for="qtd">Quantas pessoas (contando você)?</label>
  <input type="number" id="qtd" min="1" max="10" value="1"></div>
  <button class="btn" id="rsGo">Confirmar pelo WhatsApp</button>
  <div class="aviso">📲 Ao confirmar, você será levado ao WhatsApp com a mensagem pronta. É só apertar enviar para a confirmação chegar à anfitriã.</div>
  <button class="btn g" data-close>Fechar</button>
</div></div>

<script>
const CONFIG={
  whatsapp:'',                 // DDI+DDD+número, ex.: '5585999999999'
  aniversariante:'Letícia Maria',
  local:'Buffet El Dourado'
};
const $=id=>document.getElementById(id);
const v=$('v'),bgm=$('bgm');
const go=id=>$('pres').classList.toggle('on',id==='pres');
$('hL').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(CONFIG.local);
bgm.volume=.7;
let fim=false,started=false;
function travar(){
  if(fim)return;fim=true;
  $('infoImg').classList.add('on');
  setTimeout(()=>v.pause(),300);
  $('pular').style.display='none';
  document.querySelectorAll('.hs').forEach(h=>{h.classList.add('on');h.style.opacity=1});
}
$('capaImg').addEventListener('click',()=>{
  if(started)return;started=true;
  v.currentTime=0;
  const p=v.play();
  bgm.currentTime=0;bgm.play().catch(()=>{});
  const hide=()=>{$('capaImg').classList.add('off');$('pular').style.display='block'};
  v.addEventListener('playing',hide,{once:true});setTimeout(hide,900);
  if(p&&p.catch)p.catch(()=>{v.play().catch(travar)});
  requestAnimationFrame(vigia);
});
function vigia(){ if(fim)return; if(v.duration&&v.currentTime>=v.duration-0.15){travar();return} requestAnimationFrame(vigia) }
v.addEventListener('ended',travar);v.addEventListener('error',travar);
$('pular').onclick=()=>{travar()};
/* a música continua em loop enquanto o convite estiver aberto */
setInterval(()=>{ if(started&&bgm.paused)bgm.play().catch(()=>{}) },900);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&started)bgm.play().catch(()=>{}) });

$('hP').onclick=()=>go('pres');
$('voltar').onclick=()=>go('vid');
$('hC').onclick=()=>$('ovR').classList.add('on');
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.ov').classList.remove('on'));
$('ovR').addEventListener('click',e=>{if(e.target===$('ovR'))$('ovR').classList.remove('on')});

let vai=true;
$('oSim').onclick=()=>{vai=true;$('oSim').classList.add('sel');$('oNao').classList.remove('sel');$('qb').style.display=''};
$('oNao').onclick=()=>{vai=false;$('oNao').classList.add('sel');$('oSim').classList.remove('sel');$('qb').style.display='none'};
$('rsGo').onclick=()=>{
  const n=$('nome').value.trim();if(!n){$('nome').focus();return}
  const q=Math.max(1,parseInt($('qtd').value)||1);
  const msg=vai?('Olá! Aqui é '+n+'. Confirmo presença na festa de 15 anos da '+CONFIG.aniversariante+' 👑\nTotal de pessoas: '+q)
    :('Olá! Aqui é '+n+'. Infelizmente não poderei ir na festa da '+CONFIG.aniversariante+'. Obrigado(a) pelo convite!');
  window.open('https://wa.me/'+(CONFIG.whatsapp||'').replace(/\D/g,'')+'?text='+encodeURIComponent(msg),'_blank');
};
</script>
</body>
</html>
